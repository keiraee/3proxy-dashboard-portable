name: 自检

# 每次推送/PR 都跑一遍：语法、测试、以及 SHA256SUMS 与文件是否一致。
# 最后一项很关键——3p update 与安装脚本都靠 SHA256SUMS 做完整性校验，
# 改完文件忘记跑 gen-sums.sh 会让线上更新/安装直接失败。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: python -m pip install --upgrade pip flask

      - name: Python 语法检查
        run: python -m py_compile app/app.py

      - name: Shell 语法检查
        run: |
          for f in install.sh gen-sums.sh install/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: 校验 SHA256SUMS 与文件一致
        run: |
          bash gen-sums.sh
          if ! git diff --exit-code -- SHA256SUMS; then
            echo "::error::SHA256SUMS 与当前文件不一致，请在仓库根目录执行 bash gen-sums.sh 后一起提交"
            exit 1
          fi

      - name: 运行测试
        run: python -m unittest discover -s tests -v
